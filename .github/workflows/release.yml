name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode upload keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Secret KEYSTORE_BASE64 is missing. See docs/SIGNING.md"; exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
        echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

    - name: Add google-services.json (optional)
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        fi

    - name: Build signed release (AAB and/or APK)
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        BUILD_TYPE: ${{ github.event.inputs.build_type }}
      run: |
        case "$BUILD_TYPE" in
          aab) TASKS="bundleRelease" ;;
          apk) TASKS="assembleRelease" ;;
          *)   TASKS="bundleRelease assembleRelease" ;;
        esac
        ./gradlew $TASKS

    - name: Collect and verify signed files
      run: |
        mkdir -p dist
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)

        for f in app/build/outputs/apk/release/*.apk; do
          [ -e "$f" ] || continue
          case "$f" in *unsigned*) echo "::error::APK is unsigned: $f"; exit 1 ;; esac
          "$APKSIGNER" verify --print-certs "$f" | head -3
          cp "$f" dist/HiddenCats-release.apk
        done

        for f in app/build/outputs/bundle/release/*.aab; do
          [ -e "$f" ] || continue
          jarsigner -verify "$f" | tee /tmp/jarsigner.txt | head -3
          grep -q "jar verified" /tmp/jarsigner.txt || { echo "::error::AAB signature check failed"; exit 1; }
          cp "$f" dist/HiddenCats-release.aab
        done

        ls -la dist

    - name: Upload signed AAB
      if: ${{ hashFiles('dist/HiddenCats-release.aab') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-aab
        path: dist/HiddenCats-release.aab
        retention-days: 30

    - name: Upload signed APK
      if: ${{ hashFiles('dist/HiddenCats-release.apk') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-apk
        path: dist/HiddenCats-release.apk
        retention-days: 30
