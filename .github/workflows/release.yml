name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (aab or apk)'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode upload keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Secret KEYSTORE_BASE64 is missing. See docs/SIGNING.md"; exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
        echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

    - name: Add google-services.json (optional)
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        fi

    - name: Build Release Bundle (AAB)
      if: ${{ github.event.inputs.build_type == 'aab' }}
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease

    - name: Build Release APK
      if: ${{ github.event.inputs.build_type == 'apk' }}
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Verify AAB signature
      if: ${{ github.event.inputs.build_type == 'aab' }}
      run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -3

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-output
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
